<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kukuruz POS - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-card:active { transform: scale(0.95); }
        .cart-item { border-bottom: 1px solid #eee; }
    </style>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

    <header class="bg-orange-500 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">🌽 KUKURUZ GOURMET</h1>
        <div id="clock" class="text-sm font-mono"></div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="w-2/3 p-4 overflow-y-auto grid grid-cols-2 md:grid-cols-3 gap-4" id="menu-grid">
            </main>

        <aside class="w-1/3 bg-white shadow-xl flex flex-col">
            <div class="p-4 bg-gray-800 text-white font-bold">PEDIDO ACTUAL</div>
            <div id="cart-items" class="flex-1 overflow-y-auto p-2">
                </div>
            
            <div class="p-4 border-t border-gray-200">
                <div class="flex justify-between text-2xl font-bold mb-4">
                    <span>TOTAL:</span>
                    <span id="cart-total">$0</span>
                </div>
                
                <input type="number" id="customer-phone" placeholder="WhatsApp del cliente (ej: 573...)" 
                       class="w-full p-2 border rounded mb-4 text-lg">

                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button onclick="setPayment('Efectivo')" id="btn-efectivo" class="bg-gray-200 p-3 rounded font-bold">💵 EFECTIVO</button>
                    <button onclick="setPayment('Nequi')" id="btn-nequi" class="bg-gray-200 p-3 rounded font-bold">📱 NEQUI</button>
                </div>

                <button onclick="processSale()" id="btn-cobrar"
                        class="w-full bg-green-600 text-white py-4 rounded-xl text-xl font-bold shadow-lg hover:bg-green-700">
                    COBRAR Y ENVIAR
                </button>
            </div>
        </aside>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzU8-STA8ew-an52ZxxSMkX9KJiSM5RuOQ3w8rOWk0h4hxBTOidqOYFmTusQQHlx98/exec';
        
        // Configura tus productos aquí
        const productos = [
            { id: 1, name: 'Arepa de Huevo', price: 6000, img: 'https://via.placeholder.com/150?text=Arepa' },
            { id: 2, name: 'Arepa Mixta', price: 8000, img: 'https://via.placeholder.com/150?text=Mixta' },
            { id: 3, name: 'Deditos Queso', price: 2500, img: 'https://via.placeholder.com/150?text=Dedito' },
            { id: 4, name: 'Gaseosa', price: 3500, img: 'https://via.placeholder.com/150?text=Cola' }
        ];

        let cart = [];
        let paymentMethod = '';

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = productos.map(p => `
                <div onclick="addToCart(${p.id})" class="product-card bg-white p-2 rounded-lg shadow cursor-pointer hover:shadow-md transition">
                    <img src="${p.img}" class="w-full h-32 object-cover rounded mb-2">
                    <div class="font-bold text-gray-800 text-sm">${p.name}</div>
                    <div class="text-orange-600 font-bold">$${p.price}</div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const p = productos.find(x => x.id === id);
            cart.push(p);
            updateCart();
        }

        function updateCart() {
            const list = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            list.innerHTML = cart.map((item, index) => `
                <div class="cart-item flex justify-between p-2 text-sm">
                    <span>${item.name}</span>
                    <div class="flex items-center gap-2">
                        <span>$${item.price}</span>
                        <button onclick="removeItem(${index})" class="text-red-500 font-bold">X</button>
                    </div>
                </div>
            `).join('');
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            totalEl.innerText = `$${total}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function setPayment(method) {
            paymentMethod = method;
            document.getElementById('btn-efectivo').className = method === 'Efectivo' ? 'bg-orange-500 text-white p-3 rounded font-bold' : 'bg-gray-200 p-3 rounded font-bold';
            document.getElementById('btn-nequi').className = method === 'Nequi' ? 'bg-orange-500 text-white p-3 rounded font-bold' : 'bg-gray-200 p-3 rounded font-bold';
        }

        async function processSale() {
            const phone = document.getElementById('customer-phone').value;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            
            if (cart.length === 0) return alert('¡El carrito está vacío!');
            if (!paymentMethod) return alert('Elige método de pago');
            if (!phone) return alert('Pon el WhatsApp del cliente');

            const detalle = cart.map(i => i.name).join(', ');
            
            document.getElementById('btn-cobrar').innerText = "PROCESANDO...";
            document.getElementById('btn-cobrar').disabled = true;

            try {
                // Enviar a Google Sheets
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify({
                        detalle: detalle,
                        total: total,
                        pago: paymentMethod,
                        celular: phone
                    })
                });

                // Abrir WhatsApp
                const msg = `¡Hola! 🌽 *Kukuruz Gourmet*%0A📍 Codabas Módulo 1%0A--------------------%0A*Pedido:* ${detalle}%0A*Total:* $${total}%0A*Pago:* ${paymentMethod}%0A%0A¡Gracias por tu compra!`;
                window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${msg}`, '_blank');
                
                // Limpiar
                cart = [];
                updateCart();
                document.getElementById('customer-phone').value = '';
                alert('¡Venta registrada con éxito!');
                
            } catch (error) {
                alert('Error al registrar. Intenta de nuevo.');
            }
            
            document.getElementById('btn-cobrar').innerText = "COBRAR Y ENVIAR";
            document.getElementById('btn-cobrar').disabled = false;
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        renderMenu();
    </script>
</body>
</html>
