<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kukuruz POS v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 8px; 
        }
        .active-tab { background-color: #ea580c !important; color: white !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Ajuste para que el scroll funcione correctamente */
        .scroll-container { overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .content-area { padding-bottom: 240px; } 
        .btn-touch:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-sm">

    <header class="bg-white shadow-sm p-2 flex-none z-10">
        <nav class="flex gap-1 overflow-x-auto no-scrollbar font-bold">
            <button onclick="showTab('ventas')" id="btn-ventas" class="flex-1 py-3 active-tab bg-gray-100 rounded-xl text-[10px] uppercase">VENTAS</button>
            <button onclick="showTab('admin')" id="btn-admin" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-gray-500">PRODUCTOS</button>
            <button onclick="showTab('gastos')" id="btn-gastos" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-red-600">GASTOS</button>
            <button onclick="showTab('dash')" id="btn-dash" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-green-700">CIERRE</button>
        </nav>
    </header>

    <div class="flex-1 overflow-hidden flex flex-col">
        
        <div id="tab-ventas" class="flex-1 flex flex-col overflow-hidden">
            <main class="flex-1 p-3 scroll-container content-area bg-gray-50" id="menu-grid"></main>
            
            <aside class="fixed bottom-0 left-0 w-full bg-white border-t-4 border-orange-500 shadow-[0_-10px_25px_rgba(0,0,0,0.2)] p-4 z-50 rounded-t-3xl">
                <div id="mini-cart" class="max-h-20 overflow-y-auto mb-2 text-[10px] border-b border-gray-100 pb-2">
                    <p class="text-gray-400 italic text-center">No hay productos en la orden</p>
                </div>

                <div class="flex justify-between items-center mb-3">
                    <div class="flex flex-col">
                        <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Total Orden</span>
                        <span id="cart-total" class="text-3xl font-black text-orange-600 leading-none">$0</span>
                    </div>
                    <button onclick="clearCart()" class="text-red-500 font-bold border-2 border-red-100 px-3 py-2 rounded-xl btn-touch">Limpiar</button>
                </div>
                
                <div class="flex gap-2 mb-3">
                    <input type="number" id="cust-phone" placeholder="WhatsApp Cliente" class="flex-1 p-3 border-2 rounded-xl text-lg bg-gray-50 focus:border-orange-400 outline-none">
                    <div class="flex border-2 border-gray-200 rounded-xl overflow-hidden font-black">
                        <button onclick="setPay('Efectivo')" id="pay-ef" class="px-4 bg-gray-100 border-r-2 btn-touch">EFE</button>
                        <button onclick="setPay('Nequi')" id="pay-ne" class="px-4 bg-gray-100 btn-touch">NEQ</button>
                    </div>
                </div>
                
                <button onclick="processSale()" id="btn-cobrar" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black text-lg shadow-lg btn-touch uppercase">
                    REGISTRAR Y ENVIAR RECIBO
                </button>
            </aside>
        </div>

        <div id="tab-gastos" class="hidden p-6 scroll-container">
            <div class="max-w-sm mx-auto bg-white p-6 rounded-3xl shadow-xl border-t-8 border-red-500">
                <h2 class="font-black text-red-600 mb-5 text-center text-xl">REGISTRAR GASTO</h2>
                <input type="text" id="g-con" placeholder="¿En qué gastaste?" class="w-full p-4 border-2 rounded-xl mb-3 text-lg">
                <input type="number" id="g-mon" placeholder="Monto $" class="w-full p-4 border-2 rounded-xl mb-5 text-lg">
                <button onclick="saveGasto()" id="btn-g" class="w-full bg-red-500 text-white py-4 rounded-xl font-black text-lg btn-touch">GUARDAR GASTO</button>
            </div>
        </div>

        <div id="tab-admin" class="hidden p-4 scroll-container flex-1">
            <div class="max-w-sm mx-auto space-y-4">
                <div class="bg-white p-5 rounded-2xl shadow-md border-t-4 border-orange-500">
                    <h2 class="font-bold mb-3 uppercase">Crear Nuevo</h2>
                    <input type="text" id="p-name" placeholder="Nombre" class="w-full p-3 border rounded-xl mb-2">
                    <input type="number" id="p-price" placeholder="Precio" class="w-full p-3 border rounded-xl mb-2">
                    <select id="p-cat" class="w-full p-3 border rounded-xl mb-3 bg-gray-50">
                        <option value="Arepas">Arepas</option><option value="Bebidas">Bebidas</option><option value="Otros">Otros</option>
                    </select>
                    <button onclick="saveProduct()" id="btn-p" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold uppercase">Añadir</button>
                </div>
                
                <div class="bg-white p-5 rounded-2xl shadow-md">
                    <h2 class="font-bold mb-3 uppercase border-b pb-2">Inventario Actual</h2>
                    <div id="inventory-list" class="space-y-2"></div>
                </div>
            </div>
        </div>

        <div id="tab-dash" class="hidden p-6 scroll-container">
            <div class="max-w-sm mx-auto bg-white p-6 rounded-3xl shadow-xl border-4 border-orange-200 text-center">
                <h2 class="font-black mb-6 underline decoration-orange-400 text-xl uppercase">Cierre de Caja</h2>
                <div id="resumen-container" class="space-y-3 text-base text-left mb-8 bg-orange-50 p-4 rounded-2xl">
                    <div class="flex justify-between"><span>Ventas Efe:</span><span id="res-ef" class="font-bold text-green-600">$0</span></div>
                    <div class="flex justify-between"><span>Ventas Neq:</span><span id="res-ne" class="font-bold text-blue-600">$0</span></div>
                    <div class="flex justify-between border-b-2 border-orange-200 pb-3"><span>Gastos:</span><span id="res-gas" class="font-bold text-red-600">$0</span></div>
                    <div class="flex justify-between text-2xl pt-3 font-black"><span>EN CAJA:</span><span id="res-total" class="text-orange-600">$0</span></div>
                </div>
                <button onclick="sendReport()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-black text-lg btn-touch">ENVIAR REPORTE A WILSON</button>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyf6NTKRRKcjKZ5WtJuhLJ5syHwfVwEBwRpdGlnJX-q4o0gr9zEYtYGRf1zGX4NiZKS/exec';
        
        let cart = []; let paymentMethod = ''; 
        let totalEfe = 0; let totalNeq = 0; let totalGas = 0;
        let productosData = [];

        const colores = {
            'Arepas': 'bg-amber-100 border-amber-300 text-amber-900',
            'Bebidas': 'bg-sky-100 border-sky-300 text-sky-900',
            'Otros': 'bg-gray-100 border-gray-300 text-gray-900'
        };

        async function loadData() {
            try {
                const res = await fetch(scriptURL);
                productosData = await res.json();
                renderMenu();
                renderInventory();
            } catch (e) { console.error(e); }
        }

        function renderMenu() {
            document.getElementById('menu-grid').innerHTML = productosData.map(p => {
                const colorClass = colores[p.categoria] || colores['Otros'];
                return `<div onclick="addToCart('${p.nombre}', ${p.precio})" class="product-card ${colorClass} p-3 rounded-2xl border-2 shadow-sm flex flex-col items-center text-center h-28 justify-center btn-touch transition-all uppercase">
                    <span class="font-black text-[10px] leading-tight h-10 flex items-center">${p.nombre}</span>
                    <span class="font-black text-xl mt-1">$${p.precio.toLocaleString()}</span>
                </div>`}).join('');
        }

        function renderInventory() {
            document.getElementById('inventory-list').innerHTML = productosData.map(p => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg text-[10px]">
                    <span class="font-bold uppercase">${p.nombre} ($${p.precio})</span>
                    <button onclick="deleteProduct('${p.nombre}')" class="text-red-500 font-bold">BORRAR</button>
                </div>
            `).join('');
        }

        function addToCart(n, p) {
            cart.push({nombre: n, precio: parseFloat(p)});
            updateCart();
        }

        function updateCart() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            document.getElementById('cart-total').innerText = '$' + t.toLocaleString();
            
            const mini = document.getElementById('mini-cart');
            if(cart.length === 0) {
                mini.innerHTML = '<p class="text-gray-400 italic text-center">No hay productos en la orden</p>';
            } else {
                mini.innerHTML = cart.map((i, idx) => `
                    <div class="flex justify-between items-center px-2 py-0.5 border-b border-gray-50 uppercase font-bold">
                        <span>${i.nombre}</span>
                        <div>$${i.precio.toLocaleString()} <button onclick="removeFromCart(${idx})" class="text-red-500 ml-2">✕</button></div>
                    </div>
                `).join('');
                mini.scrollTop = mini.scrollHeight; // Auto-scroll al último
            }
        }

        function removeFromCart(idx) { cart.splice(idx, 1); updateCart(); }
        function clearCart() { cart = []; updateCart(); }

        function setPay(m) {
            paymentMethod = m;
            document.getElementById('pay-ef').className = m === 'Efectivo' ? 'px-4 bg-orange-600 text-white font-black border-r-2 btn-touch' : 'px-4 bg-gray-100 font-bold border-r-2 btn-touch';
            document.getElementById('pay-ne').className = m === 'Nequi' ? 'px-4 bg-orange-600 text-white font-black btn-touch' : 'px-4 bg-gray-100 font-bold btn-touch';
        }

        async function processSale() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            const phone = document.getElementById('cust-phone').value;
            if(!paymentMethod || cart.length === 0 || !phone) return alert("Falta Pago, Productos o Celular");

            const detalleSimple = cart.map(i => i.nombre).join(', ');
            
            // CONSTRUCCIÓN DEL RECIBO POR COLUMNAS
            let reciboWhatsapp = `¡Hola! 🌽 *KUKURUZ GOURMET*%0A📍 Codabas Módulo 1%0A---%0A`;
            cart.forEach(item => {
                reciboWhatsapp += `• ${item.nombre.padEnd(15)} $${item.precio.toLocaleString()}%0A`;
            });
            reciboWhatsapp += `---%0A💰 *TOTAL A PAGAR:* $${t.toLocaleString()}%0A💳 *PAGO:* ${paymentMethod}%0A%0A¡Muchas gracias por elegirnos! ✨`;

            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ detalle: detalleSimple, total: t, pago: paymentMethod, celular: phone })});
                if(paymentMethod === 'Efectivo') totalEfe += t; else totalNeq += t;
                
                window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${reciboWhatsapp}`);
                clearCart();
                document.getElementById('cust-phone').value = '';
            } catch(e) { alert("Error"); }
        }

        // --- FUNCIONES DE ADMINISTRACIÓN ---
        async function saveProduct() {
            const n = document.getElementById('p-name').value;
            const p = parseFloat(document.getElementById('p-price').value);
            const c = document.getElementById('p-cat').value;
            if(!n || !p) return alert("Faltan datos");
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "nuevoProducto", nombre: n, precio: p, categoria: c })});
            location.reload();
        }

        async function deleteProduct(nombre) {
            if(!confirm("¿Borrar " + nombre + "?")) return;
            // En el Excel simplemente puedes borrar la fila, pero aquí enviamos la instrucción
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "borrarProducto", nombre: nombre })});
            alert("Eliminado. Refresca la app.");
            location.reload();
        }

        async function saveGasto() {
            const m = parseFloat(document.getElementById('g-mon').value);
            const c = document.getElementById('g-con').value;
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "nuevoGasto", concepto: c, monto: m })});
            totalGas += m;
            alert("Gasto guardado");
            showTab('ventas');
        }

        function sendReport() {
            const totalCaja = totalEfe - totalGas;
            const msg = `🧾 *CIERRE KUKURUZ*%0A💰 *Efectivo:* $${totalEfe.toLocaleString()}%0A📱 *Nequi:* $${totalNeq.toLocaleString()}%0A💸 *Gastos:* $${totalGas.toLocaleString()}%0A---%0A🔥 *EFECTIVO EN CAJA:* $${totalCaja.toLocaleString()}`;
            window.open(`https://api.whatsapp.com/send?phone=573193490940&text=${msg}`);
        }

        function showTab(t) {
            ['ventas','admin','gastos','dash'].forEach(id => {
                document.getElementById('tab-'+id).classList.add('hidden');
                document.getElementById('btn-'+id).classList.remove('active-tab');
            });
            document.getElementById('tab-'+t).classList.remove('hidden');
            document.getElementById('btn-'+t).classList.add('active-tab');
            if(t === 'dash') {
                document.getElementById('res-ef').innerText = '$' + totalEfe.toLocaleString();
                document.getElementById('res-ne').innerText = '$' + totalNeq.toLocaleString();
                document.getElementById('res-gas').innerText = '$' + totalGas.toLocaleString();
                document.getElementById('res-total').innerText = '$' + (totalEfe - totalGas).toLocaleString();
            }
        }

        loadData();
    </script>
</body>
</html>
