<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ea580c">
    <link rel="manifest" href="manifest.json"> <title>Kukuruz POS v12.5 - PWA Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        .main-layout { display: flex; flex-direction: row; height: 100dvh; width: 100vw; overflow: hidden; background-color: #f3f4f6; }
        .menu-side { flex: 1; display: flex; flex-direction: column; height: 100dvh; }
        .scroll-area-products { flex: 1; overflow-y: auto; padding: 8px; }
        .cart-side { width: 300px; background-color: white; display: flex; flex-direction: column; height: 100dvh; border-left: 2px solid #e5e7eb; }
        .cart-items-area { flex: 1; overflow-y: auto; padding: 6px; background-image: radial-gradient(#f3f4f6 1px, transparent 1px); background-size: 15px 15px; }
        .cart-footer { flex-shrink: 0; padding: 10px; background-color: white; border-top: 4px solid #ea580c; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
        .prod-btn { height: 85px !important; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; border-width: 2px; padding: 4px; cursor: pointer; transition: all 0.1s; }
        .active-tab { background-color: #ea580c !important; color: white !important; }
        .btn-touch:active { transform: scale(0.92); }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(20px); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Botón Fullscreen mejorado */
        #fs-btn { position: absolute; top: 12px; left: 10px; z-index: 50; }
    </style>
</head>
<body class="main-layout text-[11px]">

    <button onclick="toggleFullScreen()" id="fs-btn" class="bg-white/80 border shadow-sm p-2 rounded-full text-[10px] hover:bg-white transition-all">
        🔳
    </button>

    <div class="menu-side">
        <header class="bg-white p-2 border-b flex-none pl-12"> 
            <nav class="flex gap-1 font-bold">
                <button onclick="showTab('ventas')" id="btn-ventas" class="flex-1 py-3 active-tab bg-gray-100 rounded-xl uppercase tracking-tighter text-[10px]">Ventas</button>
                <button onclick="showTab('admin')" id="btn-admin" class="flex-1 py-3 bg-gray-100 rounded-xl uppercase text-gray-400 text-[10px]">Items</button>
                <button onclick="showTab('gastos')" id="btn-gastos" class="flex-1 py-3 bg-gray-100 rounded-xl uppercase text-red-500 text-[10px]">Gastos</button>
                <button onclick="showTab('dash')" id="btn-dash" class="flex-1 py-3 bg-gray-100 rounded-xl uppercase text-green-600 tracking-tighter text-[10px]">Cierre</button>
            </nav>
        </header>

        <div id="tab-ventas" class="flex-1 flex flex-col overflow-hidden p-2">
            <div id="cat-nav" class="flex gap-2 overflow-x-auto pb-2 mb-2 border-b flex-none hide-scroll"></div>
            <div class="flex-1 overflow-y-auto hide-scroll">
                <div class="product-grid" id="grid-contenedor"></div>
            </div>
        </div>

        <div id="tab-admin" class="hidden scroll-area-products">
            <div class="max-w-xs mx-auto bg-white p-4 rounded-3xl border-2 shadow-xl mt-2 text-center">
                <h3 class="font-black mb-3 text-orange-600 italic uppercase">Nuevo Producto</h3>
                <input type="text" id="p-name" placeholder="Nombre" class="w-full p-2 border-2 rounded-xl mb-2 font-bold uppercase">
                <input type="number" id="p-price" placeholder="Precio" class="w-full p-2 border-2 rounded-xl mb-2 font-black">
                <select id="p-cat" class="w-full p-2 border-2 rounded-xl mb-3 font-bold">
                    <option>Arepas</option>
                    <option>Empanadas</option>
                    <option>Bebidas</option>
                    <option>Otros</option>
                </select>
                <button onclick="saveProduct()" id="btn-add-prod" class="w-full bg-orange-600 text-white py-3 rounded-xl font-black btn-touch uppercase">Guardar</button>
            </div>
            <div class="max-w-xs mx-auto mt-4 space-y-2" id="lista-borrar"></div>
        </div>

        <div id="tab-gastos" class="hidden scroll-area-products">
            <div class="max-w-xs mx-auto bg-white p-5 rounded-3xl border-2 shadow-xl mt-4 text-center">
                <h3 class="font-black mb-4 text-red-600 italic uppercase">Registrar Gasto</h3>
                <input type="text" id="g-desc" placeholder="Concepto" class="w-full p-3 border-2 rounded-xl mb-2 font-bold uppercase">
                <input type="number" id="g-monto" placeholder="Monto $" class="w-full p-3 border-2 rounded-xl mb-4 font-black">
                <button onclick="saveGasto()" id="btn-save-gasto" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black uppercase">Registrar Gasto</button>
            </div>
        </div>

        <div id="tab-dash" class="hidden scroll-area-products text-center">
            <div id="resumen-caja-cont" class="max-w-xs mx-auto bg-white p-6 rounded-3xl border-2 shadow-xl mt-4"></div>
        </div>
    </div>

    <aside class="cart-side">
        <div class="p-3 border-b flex justify-between items-center bg-gray-50 flex-none">
            <span class="font-black uppercase text-[10px] text-gray-400 italic">Ticket</span>
            <button onclick="clearCart()" class="text-red-500 font-bold uppercase underline text-[9px]">Limpiar</button>
        </div>
        <div id="mini-cart" class="cart-items-area space-y-1"></div>
        <div class="cart-footer">
            <div class="flex justify-between items-end mb-1">
                <div>
                    <span class="text-[8px] text-gray-400 font-bold uppercase block">Total Neto</span>
                    <div id="cart-total" class="text-4xl font-black text-orange-600 tracking-tighter leading-none">$0</div>
                </div>
                <div class="text-right">
                    <label class="text-[9px] font-black text-gray-400 block mb-1 uppercase">Whatsapp</label>
                    <label class="switch"><input type="checkbox" id="send-ws" checked><span class="slider"></span></label>
                </div>
            </div>
            <div class="space-y-1 mt-2">
                <input type="number" id="cust-phone" placeholder="Celular Cliente" class="w-full p-2 border-2 rounded-xl font-black text-center text-lg">
                <div class="flex gap-1 font-black text-[10px]">
                    <button onclick="setPay('Efectivo')" id="pay-ef" class="flex-1 py-3 bg-gray-100 rounded-xl border-b-4 border-gray-300 btn-touch uppercase">Efectivo</button>
                    <button onclick="setPay('Nequi')" id="pay-ne" class="flex-1 py-3 bg-gray-100 rounded-xl border-b-4 border-gray-300 btn-touch uppercase">Nequi</button>
                </div>
            </div>
            <button onclick="processSale()" id="btn-cobrar" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black text-xl shadow-lg btn-touch mt-2 uppercase border-b-4 border-green-800">Registrar Venta</button>
        </div>
    </aside>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyf6NTKRRKcjKZ5WtJuhLJ5syHwfVwEBwRpdGlnJX-q4o0gr9zEYtYGRf1zGX4NiZKS/exec';
        let cart = []; let paymentMethod = ''; 
        let totalEfe = 0, totalNeq = 0, totalGas = 0;
        let productosData = [];
        let categoriaActiva = 'Todas';

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        async function loadData() {
            try { 
                const res = await fetch(scriptURL); 
                productosData = await res.json(); 
                renderMenu(); 
                renderListaAdmin();
            } catch(e) {}
        }

        function renderMenu() {
            const categoriasUnicas = ['Todas', ...new Set(productosData.map(p => p.categoria || 'Otros'))];
            document.getElementById('cat-nav').innerHTML = categoriasUnicas.map(c => `
                <button onclick="filtrarPorCategoria('${c}')" class="px-4 py-2 rounded-xl font-black text-[10px] uppercase whitespace-nowrap transition-colors ${categoriaActiva === c ? 'bg-orange-600 text-white shadow-md' : 'bg-white text-gray-500 border-2 border-gray-200'}">${c}</button>
            `).join('');

            const productosFiltrados = categoriaActiva === 'Todas' ? productosData : productosData.filter(p => p.categoria === categoriaActiva);
            const colores = { 'Arepas': 'bg-amber-100 border-amber-300 text-amber-900', 'Empanadas': 'bg-yellow-100 border-yellow-300 text-yellow-900', 'Bebidas': 'bg-sky-100 border-sky-300 text-sky-900', 'Otros': 'bg-gray-100 border-gray-300 text-gray-900' };
            
            document.getElementById('grid-contenedor').innerHTML = productosFiltrados.map(p => `
                <div onclick="addToCart('${p.nombre}', ${p.precio})" class="${colores[p.categoria] || colores['Otros']} prod-btn btn-touch shadow-sm">
                    <span class="font-black text-[9px] uppercase leading-none text-center mb-1 h-5 flex items-center">${p.nombre}</span>
                    <span class="font-black text-sm">$${p.precio.toLocaleString()}</span>
                </div>`).join('');
        }

        function filtrarPorCategoria(cat) { categoriaActiva = cat; renderMenu(); }

        function renderListaAdmin() {
            document.getElementById('lista-borrar').innerHTML = productosData.map(p => `
                <div class="flex justify-between items-center bg-white p-2 rounded-xl border-2 font-bold text-[10px]">
                    <span class="uppercase">${p.nombre} <span class="text-gray-400 font-normal">(${p.categoria || 'Otros'})</span></span>
                    <button onclick="deleteProduct('${p.nombre}')" class="bg-red-100 text-red-600 px-3 py-1 rounded-lg uppercase">Eliminar</button>
                </div>`).join('');
        }

        async function saveProduct() {
            const n = document.getElementById('p-name').value;
            const p = document.getElementById('p-price').value;
            const c = document.getElementById('p-cat').value;
            if(!n || !p) return alert("Completa los datos");
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "nuevoProducto", nombre: n, precio: p, categoria: c })});
                location.reload();
            } catch(e) { alert("Error"); }
        }

        async function deleteProduct(nombre) {
            if(!confirm(`¿Borrar "${nombre}" del menú?`)) return;
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "eliminarProducto", nombre: nombre })});
                location.reload();
            } catch(e) { alert("Error al eliminar"); }
        }

        function addToCart(n, p) { cart.push({nombre: n, precio: parseFloat(p)}); updateCart(); }
        
        function updateCart() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            document.getElementById('cart-total').innerText = '$' + t.toLocaleString();
            const mini = document.getElementById('mini-cart');
            mini.innerHTML = cart.length === 0 ? '<p class="text-gray-300 italic text-center py-10">Sin productos...</p>' : 
                cart.map((i, idx) => `<div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg font-bold text-[9px] border-l-4 border-orange-400">
                    <span class="truncate uppercase">${i.nombre}</span>
                    <span>$${i.precio.toLocaleString()} <button onclick="removeFromCart(${idx})" class="text-red-500 ml-1">✕</button></span>
                </div>`).join('');
            mini.scrollTop = mini.scrollHeight;
        }

        function setPay(m) {
            paymentMethod = m;
            document.getElementById('pay-ef').className = m === 'Efectivo' ? 'flex-1 py-3 bg-orange-500 text-white rounded-xl border-b-4 border-orange-700' : 'flex-1 py-3 bg-gray-100 rounded-xl border-b-4 border-gray-300';
            document.getElementById('pay-ne').className = m === 'Nequi' ? 'flex-1 py-3 bg-orange-500 text-white rounded-xl border-b-4 border-orange-700' : 'flex-1 py-3 bg-gray-100 rounded-xl border-b-4 border-gray-300';
        }

        async function processSale() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            const phone = document.getElementById('cust-phone').value;
            const wsEnabled = document.getElementById('send-ws').checked;
            if(!paymentMethod || cart.length === 0) return alert("Faltan datos");
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ detalle: cart.map(i=>i.nombre).join(','), total: t, pago: paymentMethod, celular: phone || 'Sin Recibo' })});
                if(paymentMethod === 'Efectivo') totalEfe += t; else totalNeq += t;
                if(wsEnabled && phone) window.open(`https://api.whatsapp.com/send?phone=57${phone}&text=KUKURUZ%20GOURMET%0A---%0ATotal:%20$${t.toLocaleString()}`);
                clearCart(); document.getElementById('cust-phone').value = ''; paymentMethod = ''; renderCierre();
            } catch(e) {}
        }

        async function saveGasto() {
            const d = document.getElementById('g-desc').value;
            const m = parseFloat(document.getElementById('g-monto').value);
            if(!d || !m) return alert("Faltan datos");
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "nuevoGasto", descripcion: d, monto: m })});
            totalGas += m; document.getElementById('g-desc').value = ''; document.getElementById('g-monto').value = ''; alert("Gasto registrado");
        }

        function renderCierre() {
            const neto = (totalEfe + totalNeq) - totalGas;
            document.getElementById('resumen-caja-cont').innerHTML = `
                <h2 class="font-black text-xl italic mb-4 text-green-700 uppercase">Resumen del Día</h2>
                <div class="space-y-3 text-left font-bold uppercase text-[12px]">
                    <div class="flex justify-between border-b pb-1"><span>Efectivo:</span><span>$${totalEfe.toLocaleString()}</span></div>
                    <div class="flex justify-between border-b pb-1"><span>Nequi:</span><span>$${totalNeq.toLocaleString()}</span></div>
                    <div class="flex justify-between border-b pb-1 text-red-600"><span>Gastos:</span><span>-$${totalGas.toLocaleString()}</span></div>
                    <div class="flex justify-between pt-2 text-2xl font-black text-orange-600"><span>TOTAL:</span><span>$${neto.toLocaleString()}</span></div>
                </div>
                <button onclick="enviarCierreWS()" class="mt-6 w-full py-4 bg-green-500 text-white rounded-xl font-black uppercase shadow-lg">Enviar Reporte WhatsApp</button>
            `;
        }

        function enviarCierreWS() {
            const neto = (totalEfe + totalNeq) - totalGas;
            const texto = `💰%20*CIERRE%20KUKURUZ%20GOURMET*%0A---%0A💵%20Efectivo:%20$${totalEfe}%0A📱%20Nequi:%20$${totalNeq}%0A💸%20Gastos:%20$${totalGas}%0A📊%20*TOTAL%20NETO:%20$${neto}*`;
            window.open(`https://api.whatsapp.com/send?phone=573193490940&text=${texto}`);
        }

        function showTab(t) {
            ['ventas','admin','gastos','dash'].forEach(id => {
                document.getElementById('tab-'+id).classList.add('hidden');
                document.getElementById('btn-'+id).classList.remove('active-tab');
            });
            document.getElementById('tab-'+t).classList.remove('hidden');
            document.getElementById('btn-'+t).classList.add('active-tab');
            if(t === 'dash') renderCierre();
        }

        function clearCart() { cart = []; updateCart(); }
        function removeFromCart(idx) { cart.splice(idx, 1); updateCart(); }
        loadData();
    </script>
</body>
</html>
