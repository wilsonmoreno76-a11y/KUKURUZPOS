<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kukuruz POS v5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Grilla de productos: Botones más compactos para que quepan muchos */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 8px; 
        }
        .active-tab { background-color: #ea580c !important; color: white !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* ESTRUCTURA PRINCIPAL FORZADA */
        .main-layout { 
            display: flex; 
            flex-direction: row; /* Forzamos lateralidad */
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        /* Lado de productos */
        .menu-side { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background-color: #f9fafb;
            border-right: 2px solid #e5e7eb;
        }

        /* Lado del carrito (Fijo a la derecha) */
        .cart-side { 
            width: 320px; /* Ancho fijo para el carrito */
            background-color: white;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 15px rgba(0,0,0,0.05);
            z-index: 50;
        }

        /* Scroll independiente para los productos */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
        }

        /* Ajuste para celulares (Pantallas muy pequeñas) */
        @media (max-width: 600px) {
            .main-layout { flex-direction: column; }
            .cart-side { width: 100%; height: 250px; }
        }

        .btn-touch:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body class="bg-gray-100 main-layout text-sm">

    <div class="menu-side">
        <header class="bg-white p-2 shadow-sm flex-none">
            <nav class="flex gap-1 font-bold">
                <button onclick="showTab('ventas')" id="btn-ventas" class="flex-1 py-3 active-tab bg-gray-100 rounded-xl text-[10px] uppercase">VENTAS</button>
                <button onclick="showTab('admin')" id="btn-admin" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase">PRODUCTOS</button>
                <button onclick="showTab('gastos')" id="btn-gastos" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-red-600">GASTOS</button>
                <button onclick="showTab('dash')" id="btn-dash" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-green-700">CIERRE</button>
            </nav>
        </header>

        <div id="tab-ventas" class="scroll-area product-grid">
            </div>

        <div id="tab-admin" class="hidden scroll-area">
             <div class="bg-white p-5 rounded-2xl shadow-sm border-t-4 border-orange-500 mb-4">
                <h2 class="font-bold mb-3 uppercase">Nuevo Producto</h2>
                <input type="text" id="p-name" placeholder="Nombre" class="w-full p-3 border rounded-xl mb-2">
                <input type="number" id="p-price" placeholder="Precio" class="w-full p-3 border rounded-xl mb-2">
                <select id="p-cat" class="w-full p-3 border rounded-xl mb-3"><option>Arepas</option><option>Bebidas</option><option>Otros</option></select>
                <button onclick="saveProduct()" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold">CREAR</button>
             </div>
             <div id="inventory-list" class="space-y-2"></div>
        </div>

        <div id="tab-gastos" class="hidden scroll-area">
            <div class="bg-white p-6 rounded-2xl shadow max-w-xs mx-auto mt-10">
                <h2 class="font-bold text-red-600 mb-4">GASTOS</h2>
                <input type="text" id="g-con" placeholder="Concepto" class="w-full p-3 border rounded-xl mb-2">
                <input type="number" id="g-mon" placeholder="Monto" class="w-full p-3 border rounded-xl mb-4">
                <button onclick="saveGasto()" class="w-full bg-red-500 text-white py-3 rounded-xl font-bold">GUARDAR</button>
            </div>
        </div>

        <div id="tab-dash" class="hidden scroll-area text-center">
            <div class="bg-white p-8 rounded-3xl shadow-xl max-w-xs mx-auto mt-10 border-4 border-orange-100">
                <h2 class="font-black text-xl mb-6">CIERRE</h2>
                <div id="resumen-container" class="text-left space-y-3 mb-6">
                    <div class="flex justify-between"><span>Efectivo:</span><span id="res-ef" class="font-bold text-green-600"></span></div>
                    <div class="flex justify-between"><span>Nequi:</span><span id="res-ne" class="font-bold text-blue-600"></span></div>
                    <div class="flex justify-between border-b pb-2"><span>Gastos:</span><span id="res-gas" class="font-bold text-red-600"></span></div>
                    <div class="flex justify-between text-xl font-black pt-2"><span>CAJA:</span><span id="res-total" class="text-orange-600"></span></div>
                </div>
                <button onclick="sendReport()" class="w-full bg-orange-600 text-white py-4 rounded-xl font-black">ENVIAR REPORTE</button>
            </div>
        </div>
    </div>

    <aside class="cart-side p-4">
        <h2 class="font-black text-gray-400 uppercase text-[10px] mb-2 tracking-widest">Orden Actual</h2>
        
        <div id="mini-cart" class="flex-1 overflow-y-auto mb-4 space-y-2 border-b border-gray-100">
            <p class="text-gray-400 italic text-center py-10">Vacío</p>
        </div>

        <div class="py-4">
            <span class="text-[10px] text-gray-400 font-bold uppercase">Total</span>
            <div id="cart-total" class="text-4xl font-black text-orange-600 tracking-tighter leading-none">$0</div>
        </div>

        <div class="space-y-2 mb-4">
            <input type="number" id="cust-phone" placeholder="WhatsApp Cliente" class="w-full p-3 border-2 rounded-xl text-lg outline-none focus:border-orange-500">
            <div class="flex border-2 rounded-xl overflow-hidden font-black w-full text-center">
                <button onclick="setPay('Efectivo')" id="pay-ef" class="flex-1 py-3 bg-gray-100 border-r-2 btn-touch">EFE</button>
                <button onclick="setPay('Nequi')" id="pay-ne" class="flex-1 py-3 bg-gray-100 btn-touch">NEQ</button>
            </div>
        </div>

        <button onclick="processSale()" id="btn-cobrar" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black text-lg shadow-lg btn-touch uppercase">
            COBRAR
        </button>
        <button onclick="clearCart()" class="w-full text-red-400 font-bold text-xs mt-3 uppercase tracking-widest">Limpiar Orden</button>
    </aside>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyf6NTKRRKcjKZ5WtJuhLJ5syHwfVwEBwRpdGlnJX-q4o0gr9zEYtYGRf1zGX4NiZKS/exec';
        let cart = []; let paymentMethod = ''; 
        let totalEfe = 0; let totalNeq = 0; let totalGas = 0;
        let productosData = [];

        const colores = {
            'Arepas': 'bg-amber-100 border-amber-300 text-amber-900',
            'Bebidas': 'bg-sky-100 border-sky-300 text-sky-900',
            'Otros': 'bg-gray-100 border-gray-300 text-gray-900'
        };

        async function loadData() {
            const res = await fetch(scriptURL);
            productosData = await res.json();
            renderMenu();
            renderInventory();
        }

        function renderMenu() {
            document.getElementById('tab-ventas').innerHTML = productosData.map(p => {
                const color = colores[p.categoria] || colores['Otros'];
                return `
                <div onclick="addToCart('${p.nombre}', ${p.precio})" class="${color} p-3 rounded-2xl border-2 shadow-sm flex flex-col items-center justify-center text-center btn-touch h-24">
                    <span class="font-black text-[9px] uppercase leading-tight h-8 flex items-center">${p.nombre}</span>
                    <span class="font-black text-base">$${p.precio.toLocaleString()}</span>
                </div>`}).join('');
        }

        function renderInventory() {
            document.getElementById('inventory-list').innerHTML = productosData.map(p => `
                <div class="flex justify-between bg-white p-3 rounded-xl shadow-sm items-center text-[10px]">
                    <span class="font-bold uppercase">${p.nombre} - $${p.precio}</span>
                    <button onclick="deleteProduct('${p.nombre}')" class="text-red-500 font-black">ELIMINAR</button>
                </div>`).join('');
        }

        function addToCart(n, p) { cart.push({nombre: n, precio: parseFloat(p)}); updateCart(); }
        
        function updateCart() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            document.getElementById('cart-total').innerText = '$' + t.toLocaleString();
            const mini = document.getElementById('mini-cart');
            mini.innerHTML = cart.length === 0 ? '<p class="text-gray-400 italic text-center py-10">Vacío</p>' : 
                cart.map((i, idx) => `<div class="flex justify-between font-bold uppercase text-[10px] bg-gray-50 p-2 rounded-lg border-l-4 border-orange-400"><span>${i.nombre}</span><span>$${i.precio.toLocaleString()} <button onclick="removeFromCart(${idx})" class="text-red-500 ml-2">✕</button></span></div>`).join('');
            mini.scrollTop = mini.scrollHeight;
        }

        function removeFromCart(idx) { cart.splice(idx, 1); updateCart(); }
        function clearCart() { cart = []; updateCart(); }
        
        function setPay(m) {
            paymentMethod = m;
            document.getElementById('pay-ef').className = m === 'Efectivo' ? 'flex-1 py-3 bg-orange-600 text-white font-black border-r-2' : 'flex-1 py-3 bg-gray-100 font-black border-r-2';
            document.getElementById('pay-ne').className = m === 'Nequi' ? 'flex-1 py-3 bg-orange-600 text-white font-black' : 'flex-1 py-3 bg-gray-100 font-black';
        }

        async function processSale() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            const phone = document.getElementById('cust-phone').value;
            if(!paymentMethod || cart.length === 0 || !phone) return alert("Faltan datos");

            let recibo = `¡Hola! 🌽 *KUKURUZ GOURMET*%0A---%0A`;
            cart.forEach(item => { recibo += `• ${item.nombre}: $${item.precio.toLocaleString()}%0A`; });
            recibo += `---%0A💰 *TOTAL:* $${t.toLocaleString()}%0A💳 *PAGO:* ${paymentMethod}%0A%0A¡Gracias! ✨`;

            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ detalle: cart.map(i=>i.nombre).join(','), total: t, pago: paymentMethod, celular: phone })});
            if(paymentMethod === 'Efectivo') totalEfe += t; else totalNeq += t;
            window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${recibo}`);
            clearCart(); document.getElementById('cust-phone').value = '';
        }

        async function saveProduct() {
            const n = document.getElementById('p-name').value;
            const p = document.getElementById('p-price').value;
            const c = document.getElementById('p-cat').value;
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "nuevoProducto", nombre: n, precio: p, categoria: c })});
            location.reload();
        }

        async function saveGasto() {
            const m = parseFloat(document.getElementById('g-mon').value);
            const c = document.getElementById('g-con').value;
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "nuevoGasto", concepto: c, monto: m })});
            totalGas += m; alert("Gasto guardado"); showTab('ventas');
        }

        function sendReport() {
            const total = totalEfe - totalGas;
            const msg = `🧾 *CIERRE KUKURUZ*%0A💰 Efe: $${totalEfe.toLocaleString()}%0A📱 Neq: $${totalNeq.toLocaleString()}%0A💸 Gas: $${totalGas.toLocaleString()}%0A---%0A🔥 *CAJA:* $${total.toLocaleString()}`;
            window.open(`https://api.whatsapp.com/send?phone=573193490940&text=${msg}`);
        }

        function showTab(t) {
            ['ventas','admin','gastos','dash'].forEach(id => {
                document.getElementById('tab-'+id).classList.add('hidden');
                document.getElementById('btn-'+id).classList.remove('active-tab');
            });
            document.getElementById('tab-'+t).classList.remove('hidden');
            document.getElementById('btn-'+t).classList.add('active-tab');
            if(t === 'dash') {
                document.getElementById('res-ef').innerText = '$' + totalEfe.toLocaleString();
                document.getElementById('res-ne').innerText = '$' + totalNeq.toLocaleString();
                document.getElementById('res-gas').innerText = '$' + totalGas.toLocaleString();
                document.getElementById('res-total').innerText = '$' + (totalEfe - totalGas).toLocaleString();
            }
        }
        loadData();
    </script>
</body>
</html>
