<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kukuruz POS v7 - Fixed Button</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); 
            gap: 10px; 
            padding-bottom: 30px; 
        }
        .active-tab { background-color: #ea580c !important; color: white !important; }

        .main-layout { 
            display: flex; 
            flex-direction: row; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        .menu-side { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background-color: #f3f4f6;
            height: 100vh;
        }

        /* AREA DE PRODUCTOS CON SCROLL */
        .scroll-area-products {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
        }

        /* LADO DEL CARRITO ESTRUCTURADO */
        .cart-side { 
            width: 350px; 
            background-color: white;
            display: flex;
            flex-direction: column; /* Esto permite dividir arriba y abajo */
            box-shadow: -5px 0 20px rgba(0,0,0,0.1);
            z-index: 50;
            height: 100vh;
        }

        /* Lista de productos del carrito con scroll */
        .cart-items-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #ffffff;
        }

        /* EL PANEL DE COBRO FIJO ABAJO */
        .cart-footer {
            flex: none; /* No se mueve */
            padding: 20px;
            background-color: white;
            border-top: 2px solid #f3f4f6;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.02);
        }

        @media (max-width: 800px) {
            .main-layout { flex-direction: column; }
            .cart-side { width: 100%; height: 40%; border-top: 4px solid #ea580c; }
            .menu-side { height: 60%; }
        }

        .btn-touch:active { transform: scale(0.95); opacity: 0.9; }
    </style>
</head>
<body class="bg-gray-100 main-layout text-sm">

    <div class="menu-side border-r">
        <header class="bg-white p-3 shadow-sm flex-none">
            <nav class="flex gap-2 font-bold">
                <button onclick="showTab('ventas')" id="btn-ventas" class="flex-1 py-3 active-tab bg-gray-100 rounded-xl text-[10px] uppercase">VENTAS</button>
                <button onclick="showTab('admin')" id="btn-admin" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-gray-400">PRODUCTOS</button>
                <button onclick="showTab('gastos')" id="btn-gastos" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-red-600">GASTOS</button>
                <button onclick="showTab('dash')" id="btn-dash" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-green-700">CIERRE</button>
            </nav>
        </header>

        <div id="tab-ventas" class="scroll-area-products">
            <div class="product-grid" id="grid-contenedor"></div>
        </div>

        <div id="tab-admin" class="hidden scroll-area-products">
            <div class="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-sm border-t-8 border-orange-500 mb-6">
               <h2 class="font-black mb-4 uppercase">Nuevo Producto</h2>
               <input type="text" id="p-name" placeholder="Nombre" class="w-full p-4 border-2 rounded-2xl mb-3">
               <input type="number" id="p-price" placeholder="Precio" class="w-full p-4 border-2 rounded-2xl mb-3">
               <select id="p-cat" class="w-full p-4 border-2 rounded-2xl mb-5 bg-gray-50">
                   <option value="Arepas">Arepas</option>
                   <option value="Bebidas">Bebidas</option>
                   <option value="Otros">Otros</option>
               </select>
               <button onclick="saveProduct()" class="w-full bg-orange-600 text-white py-4 rounded-2xl font-black btn-touch">GUARDAR</button>
            </div>
            <div id="inventory-list" class="max-w-md mx-auto space-y-2"></div>
       </div>

       <div id="tab-gastos" class="hidden scroll-area-products">
           <div class="max-w-xs mx-auto bg-white p-6 rounded-3xl shadow-lg mt-10">
               <h2 class="font-black text-red-600 mb-5 text-center">GASTO NUEVO</h2>
               <input type="text" id="g-con" placeholder="Concepto" class="w-full p-4 border-2 rounded-2xl mb-3 text-center">
               <input type="number" id="g-mon" placeholder="Monto $" class="w-full p-4 border-2 rounded-2xl mb-5 text-center">
               <button onclick="saveGasto()" class="w-full bg-red-500 text-white py-4 rounded-2xl font-black">REGISTRAR</button>
           </div>
       </div>

       <div id="tab-dash" class="hidden scroll-area-products text-center">
           <div class="max-w-xs mx-auto bg-white p-8 rounded-[40px] shadow-xl mt-10 border-4 border-orange-50">
               <h1 class="font-black text-xl mb-6">CIERRE</h1>
               <div class="text-left space-y-4 mb-8 bg-gray-50 p-5 rounded-2xl">
                   <div class="flex justify-between"><span>Efectivo:</span><span id="res-ef" class="font-bold text-green-600"></span></div>
                   <div class="flex justify-between"><span>Nequi:</span><span id="res-ne" class="font-bold text-blue-600"></span></div>
                   <div class="flex justify-between border-b pb-3"><span>Gastos:</span><span id="res-gas" class="font-bold text-red-600"></span></div>
                   <div class="flex justify-between text-xl font-black text-orange-600 pt-2"><span>TOTAL:</span><span id="res-total"></span></div>
               </div>
               <button onclick="sendReport()" class="w-full bg-orange-600 text-white py-4 rounded-2xl font-black uppercase text-[10px]">Enviar Cierre a Wilson</button>
           </div>
       </div>
    </div>

    <aside class="cart-side">
        <div id="mini-cart" class="cart-items-area space-y-2">
            <p class="text-gray-400 italic text-center py-10">Esperando orden...</p>
        </div>

        <div class="cart-footer">
            <div class="flex justify-between items-end mb-4">
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-400 font-bold uppercase">Total Neto</span>
                    <div id="cart-total" class="text-5xl font-black text-orange-600 tracking-tighter leading-none">$0</div>
                </div>
                <button onclick="clearCart()" class="text-red-400 font-bold text-[10px] uppercase underline">Vaciar</button>
            </div>

            <div class="space-y-2 mb-4">
                <input type="number" id="cust-phone" placeholder="Celular Cliente" class="w-full p-4 border-2 rounded-2xl text-lg font-bold bg-gray-50 focus:border-orange-500 outline-none">
                <div class="flex border-2 rounded-2xl overflow-hidden font-black">
                    <button onclick="setPay('Efectivo')" id="pay-ef" class="flex-1 py-4 bg-gray-100 border-r-2 btn-touch">EFE</button>
                    <button onclick="setPay('Nequi')" id="pay-ne" class="flex-1 py-4 bg-gray-100 btn-touch">NEQ</button>
                </div>
            </div>

            <button onclick="processSale()" id="btn-cobrar" class="w-full bg-green-600 text-white py-5 rounded-[24px] font-black text-xl shadow-lg btn-touch uppercase tracking-wider">
                REGISTRAR VENTA
            </button>
        </div>
    </aside>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyf6NTKRRKcjKZ5WtJuhLJ5syHwfVwEBwRpdGlnJX-q4o0gr9zEYtYGRf1zGX4NiZKS/exec';
        let cart = []; let paymentMethod = ''; 
        let totalEfe = 0; let totalNeq = 0; let totalGas = 0;
        let productosData = [];

        const colores = {
            'Arepas': 'bg-amber-100 border-amber-300 text-amber-900',
            'Bebidas': 'bg-sky-100 border-sky-300 text-sky-900',
            'Otros': 'bg-gray-100 border-gray-300 text-gray-900'
        };

        async function loadData() {
            try {
                const res = await fetch(scriptURL);
                productosData = await res.json();
                renderMenu();
                renderInventory();
            } catch(e) { console.error(e); }
        }

        function renderMenu() {
            document.getElementById('grid-contenedor').innerHTML = productosData.map(p => {
                const color = colores[p.categoria] || colores['Otros'];
                return `
                <div onclick="addToCart('${p.nombre}', ${p.precio})" class="${color} p-4 rounded-3xl border-2 shadow-sm flex flex-col items-center justify-center text-center btn-touch h-28 cursor-pointer">
                    <span class="font-black text-[10px] uppercase leading-tight h-10 flex items-center">${p.nombre}</span>
                    <span class="font-black text-xl">$${p.precio.toLocaleString()}</span>
                </div>`}).join('');
        }

        function renderInventory() {
            document.getElementById('inventory-list').innerHTML = productosData.map(p => `
                <div class="flex justify-between bg-white p-4 rounded-2xl shadow-sm items-center text-xs">
                    <span class="font-bold uppercase">${p.nombre} - $${p.precio}</span>
                    <button onclick="deleteProduct('${p.nombre}')" class="text-red-500 font-bold px-2 py-1 bg-red-50 rounded-lg">✕</button>
                </div>`).join('');
        }

        function addToCart(n, p) { cart.push({nombre: n, precio: parseFloat(p)}); updateCart(); }
        
        function updateCart() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            document.getElementById('cart-total').innerText = '$' + t.toLocaleString();
            const mini = document.getElementById('mini-cart');
            mini.innerHTML = cart.length === 0 ? '<p class="text-gray-400 italic text-center py-10">Esperando orden...</p>' : 
                cart.map((i, idx) => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl font-bold uppercase text-[10px] border-l-4 border-orange-400">
                    <span>${i.nombre}</span>
                    <div class="flex items-center gap-2">
                        <span>$${i.precio.toLocaleString()}</span>
                        <button onclick="removeFromCart(${idx})" class="text-red-500 text-lg">✕</button>
                    </div>
                </div>`).join('');
            mini.scrollTop = mini.scrollHeight;
        }

        function removeFromCart(idx) { cart.splice(idx, 1); updateCart(); }
        function clearCart() { cart = []; updateCart(); }
        
        function setPay(m) {
            paymentMethod = m;
            document.getElementById('pay-ef').className = m === 'Efectivo' ? 'flex-1 py-4 bg-orange-500 text-white font-black border-r-2 btn-touch' : 'flex-1 py-4 bg-gray-100 font-black border-r-2 btn-touch';
            document.getElementById('pay-ne').className = m === 'Nequi' ? 'flex-1 py-4 bg-orange-500 text-white font-black btn-touch' : 'flex-1 py-4 bg-gray-100 font-black btn-touch';
        }

        async function processSale() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            const phone = document.getElementById('cust-phone').value;
            if(!paymentMethod || cart.length === 0 || !phone) return alert("Falta Pago o Celular");

            const btn = document.getElementById('btn-cobrar');
            btn.innerText = "ENVIANDO..."; btn.disabled = true;

            let recibo = `¡Hola! 🌽 *KUKURUZ GOURMET*%0A---%0A`;
            cart.forEach(item => { recibo += `• ${item.nombre}: $${item.precio.toLocaleString()}%0A`; });
            recibo += `---%0A💰 *TOTAL:* $${t.toLocaleString()}%0A💳 *PAGO:* ${paymentMethod}%0A%0A¡Muchas gracias! ✨`;

            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ detalle: cart.map(i=>i.nombre).join(','), total: t, pago: paymentMethod, celular: phone })});
                if(paymentMethod === 'Efectivo') totalEfe += t; else totalNeq += t;
                window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${recibo}`);
                clearCart(); document.getElementById('cust-phone').value = '';
            } catch(e) { alert("Error al guardar"); }
            
            btn.innerText = "REGISTRAR VENTA"; btn.disabled = false;
        }

        async function saveProduct() {
            const n = document.getElementById('p-name').value;
            const p = document.getElementById('p-price').value;
            const c = document.getElementById('p-cat').value;
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "nuevoProducto", nombre: n, precio: p, categoria: c })});
            location.reload();
        }

        async function saveGasto() {
            const m = parseFloat(document.getElementById('g-mon').value);
            const c = document.getElementById('g-con').value;
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "nuevoGasto", concepto: c, monto: m })});
            totalGas += m; alert("Gasto guardado"); showTab('ventas');
        }

        function sendReport() {
            const total = totalEfe - totalGas;
            const msg = `🧾 *CIERRE KUKURUZ*%0A💰 Efe: $${totalEfe.toLocaleString()}%0A📱 Neq: $${totalNeq.toLocaleString()}%0A💸 Gas: $${totalGas.toLocaleString()}%0A---%0A🔥 *CAJA:* $${total.toLocaleString()}`;
            window.open(`https://api.whatsapp.com/send?phone=573193490940&text=${msg}`);
        }

        function showTab(t) {
            ['ventas','admin','gastos','dash'].forEach(id => {
                document.getElementById('tab-'+id).classList.add('hidden');
                document.getElementById('btn-'+id).classList.remove('active-tab');
            });
            document.getElementById('tab-'+t).classList.remove('hidden');
            document.getElementById('btn-'+t).classList.add('active-tab');
            if(t === 'dash') {
                document.getElementById('res-ef').innerText = '$' + totalEfe.toLocaleString();
                document.getElementById('res-ne').innerText = '$' + totalNeq.toLocaleString();
                document.getElementById('res-gas').innerText = '$' + totalGas.toLocaleString();
                document.getElementById('res-total').innerText = '$' + (totalEfe - totalGas).toLocaleString();
            }
        }
        loadData();
    </script>
</body>
</html>
