<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kukuruz POS v10 - Final Lock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 8px; 
        }

        .active-tab { background-color: #ea580c !important; color: white !important; }

        .main-layout { 
            display: flex; 
            flex-direction: row; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            background-color: #f3f4f6;
        }

        .menu-side { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }

        .scroll-area-products {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* CARRITO: ESTRUCTURA RÍGIDA */
        .cart-side { 
            width: 320px; 
            background-color: white;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Altura total de la tablet */
            border-left: 2px solid #e5e7eb;
        }

        /* Área de items: Es la ÚNICA que puede crecer y hacer scroll */
        .cart-items-area {
            flex: 1; 
            overflow-y: auto;
            padding: 10px;
            background-color: #ffffff;
        }

        /* ÁREA DE COBRO: SIEMPRE VISIBLE AL FINAL */
        .cart-footer {
            flex: none; /* No permite que se encoja ni se mueva */
            padding: 12px;
            background-color: #f9fafb;
            border-top: 3px solid #ea580c; /* Línea naranja divisoria */
        }

        /* Botones de producto: Forzados a 85px */
        .prod-btn {
            height: 85px !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            border-width: 2px;
            padding: 5px;
            cursor: pointer;
        }

        .btn-touch:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body class="main-layout text-sm">

    <div class="menu-side">
        <header class="bg-white p-2 shadow-sm flex-none border-b">
            <nav class="flex gap-1 font-bold">
                <button onclick="showTab('ventas')" id="btn-ventas" class="flex-1 py-3 active-tab bg-gray-100 rounded-xl text-[10px] uppercase">VENTAS</button>
                <button onclick="showTab('admin')" id="btn-admin" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-gray-400">PRODUCTOS</button>
                <button onclick="showTab('gastos')" id="btn-gastos" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-red-500">GASTOS</button>
                <button onclick="showTab('dash')" id="btn-dash" class="flex-1 py-3 bg-gray-100 rounded-xl text-[10px] uppercase text-green-600">CIERRE</button>
            </nav>
        </header>

        <div id="tab-ventas" class="scroll-area-products">
            <div class="product-grid" id="grid-contenedor"></div>
        </div>

        <div id="tab-gastos" class="hidden scroll-area-products">
            <div class="max-w-xs mx-auto bg-white p-6 rounded-3xl shadow-lg mt-5 border-2">
                <h2 class="font-black text-red-600 mb-5 text-center uppercase tracking-tighter">Registrar Gasto</h2>
                <input type="text" id="g-con" placeholder="¿En qué se gastó?" class="w-full p-4 border-2 rounded-2xl mb-3 text-center font-bold">
                <input type="number" id="g-mon" placeholder="Monto $" class="w-full p-4 border-2 rounded-2xl mb-5 text-center font-black text-xl text-red-600">
                <button onclick="saveGasto()" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black btn-touch">GUARDAR GASTO</button>
            </div>
        </div>

        <div id="tab-dash" class="hidden scroll-area-products text-center">
            <div class="max-w-xs mx-auto bg-white p-6 rounded-[35px] shadow-xl mt-5 border-2">
                <h1 class="font-black text-lg mb-4 text-orange-600 uppercase italic">Resumen de Caja</h1>
                <div class="text-left space-y-3 mb-6 bg-gray-50 p-5 rounded-2xl border">
                    <div class="flex justify-between"><span>Efectivo:</span><span id="res-ef" class="font-black text-green-600">$0</span></div>
                    <div class="flex justify-between"><span>Nequi:</span><span id="res-ne" class="font-black text-blue-600">$0</span></div>
                    <div class="flex justify-between border-b-2 pb-2"><span>Gastos:</span><span id="res-gas" class="font-black text-red-600">$0</span></div>
                    <div class="flex justify-between text-xl font-black text-orange-600 pt-2"><span>TOTAL:</span><span id="res-total">$0</span></div>
                </div>
                <button onclick="sendReport()" class="w-full bg-orange-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] btn-touch">Enviar Reporte a Wilson</button>
            </div>
        </div>

        <div id="tab-admin" class="hidden scroll-area-products">
            <div class="max-w-xs mx-auto bg-white p-4 rounded-xl shadow-sm border-t-4 border-orange-500 my-4">
                <input type="text" id="p-name" placeholder="Nombre Producto" class="w-full p-2 border rounded-lg mb-2">
                <input type="number" id="p-price" placeholder="Precio" class="w-full p-2 border rounded-lg mb-2">
                <select id="p-cat" class="w-full p-2 border rounded-lg mb-3"><option>Arepas</option><option>Bebidas</option><option>Otros</option></select>
                <button onclick="saveProduct()" class="w-full bg-orange-600 text-white py-2 rounded-lg font-bold">Añadir al Menú</button>
            </div>
        </div>
    </div>

    <aside class="cart-side">
        <div class="p-3 border-b bg-gray-50 flex justify-between items-center flex-none">
            <span class="font-black text-[10px] text-gray-400 uppercase tracking-widest italic">Orden Actual</span>
            <button onclick="clearCart()" class="text-red-500 text-[10px] font-bold uppercase underline">Vaciar</button>
        </div>
        
        <div id="mini-cart" class="cart-items-area space-y-1">
            <p class="text-gray-400 italic text-center py-10 text-xs">Selecciona productos...</p>
        </div>

        <div class="cart-footer">
            <div class="mb-2 flex justify-between items-end">
                <div>
                    <span class="text-[9px] text-gray-400 font-bold uppercase block">Total Neto</span>
                    <div id="cart-total" class="text-4xl font-black text-orange-600 tracking-tighter leading-none">$0</div>
                </div>
            </div>

            <div class="space-y-1 mb-2">
                <input type="number" id="cust-phone" placeholder="Celular Cliente" class="w-full p-3 border-2 rounded-xl font-black bg-white text-lg outline-none focus:border-orange-500">
                <div class="flex border-2 rounded-xl overflow-hidden font-black text-[11px]">
                    <button onclick="setPay('Efectivo')" id="pay-ef" class="flex-1 py-3 bg-gray-100 border-r-2 btn-touch">EFECTIVO</button>
                    <button onclick="setPay('Nequi')" id="pay-ne" class="flex-1 py-3 bg-gray-100 btn-touch">NEQUI</button>
                </div>
            </div>

            <button onclick="processSale()" id="btn-cobrar" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black text-xl shadow-lg btn-touch uppercase tracking-tighter border-b-4 border-green-800">
                Registrar Venta
            </button>
        </div>
    </aside>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyf6NTKRRKcjKZ5WtJuhLJ5syHwfVwEBwRpdGlnJX-q4o0gr9zEYtYGRf1zGX4NiZKS/exec';
        let cart = []; let paymentMethod = ''; 
        let totalEfe = 0, totalNeq = 0, totalGas = 0;
        let productosData = [];

        const colores = { 'Arepas': 'bg-amber-100 border-amber-300 text-amber-900', 'Bebidas': 'bg-sky-100 border-sky-300 text-sky-900', 'Otros': 'bg-gray-100 border-gray-300 text-gray-900' };

        async function loadData() {
            try {
                const res = await fetch(scriptURL);
                productosData = await res.json();
                renderMenu();
            } catch(e) { console.error("Error cargando datos"); }
        }

        function renderMenu() {
            document.getElementById('grid-contenedor').innerHTML = productosData.map(p => `
                <div onclick="addToCart('${p.nombre}', ${p.precio})" class="${colores[p.categoria] || colores['Otros']} prod-btn btn-touch shadow-sm">
                    <span class="font-black text-[9px] uppercase leading-tight text-center mb-1 h-6 flex items-center">${p.nombre}</span>
                    <span class="font-black text-base">$${p.precio.toLocaleString()}</span>
                </div>`).join('');
        }

        function addToCart(n, p) { cart.push({nombre: n, precio: parseFloat(p)}); updateCart(); }
        
        function updateCart() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            document.getElementById('cart-total').innerText = '$' + t.toLocaleString();
            const mini = document.getElementById('mini-cart');
            mini.innerHTML = cart.length === 0 ? '<p class="text-gray-400 italic text-center py-10 text-xs">Selecciona productos...</p>' : 
                cart.map((i, idx) => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg font-bold uppercase text-[9px] border-l-4 border-orange-400">
                    <span class="truncate pr-2">${i.nombre}</span>
                    <span class="flex-none">$${i.precio.toLocaleString()} <button onclick="removeFromCart(${idx})" class="text-red-500 ml-1 font-black">✕</button></span>
                </div>`).join('');
            mini.scrollTop = mini.scrollHeight;
        }

        function removeFromCart(idx) { cart.splice(idx, 1); updateCart(); }
        function clearCart() { cart = []; updateCart(); }
        
        function setPay(m) {
            paymentMethod = m;
            document.getElementById('pay-ef').className = m === 'Efectivo' ? 'flex-1 py-3 bg-orange-500 text-white font-black border-r-2 btn-touch' : 'flex-1 py-3 bg-gray-100 font-black border-r-2 btn-touch';
            document.getElementById('pay-ne').className = m === 'Nequi' ? 'flex-1 py-3 bg-orange-500 text-white font-black btn-touch' : 'flex-1 py-3 bg-gray-100 font-black btn-touch';
        }

        async function processSale() {
            const t = cart.reduce((s, i) => s + i.precio, 0);
            const phone = document.getElementById('cust-phone').value;
            if(!paymentMethod || cart.length === 0 || !phone) return alert("Completa: Pago + Celular + Productos");
            const btn = document.getElementById('btn-cobrar');
            btn.innerText = "PROCESANDO..."; btn.disabled = true;
            try {
                await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ detalle: cart.map(i=>i.nombre).join(','), total: t, pago: paymentMethod, celular: phone })});
                if(paymentMethod === 'Efectivo') totalEfe += t; else totalNeq += t;
                window.open(`https://api.whatsapp.com/send?phone=${phone}&text=KUKURUZ%20GOURMET%0A---%0ATotal:%20$${t.toLocaleString()}%0A¡Gracias!`);
                clearCart(); document.getElementById('cust-phone').value = '';
            } catch(e) { alert("Error de red"); }
            btn.innerText = "REGISTRAR VENTA"; btn.disabled = false;
        }

        async function saveGasto() {
            const m = parseFloat(document.getElementById('g-mon').value);
            const c = document.getElementById('g-con').value;
            if(!m || !c) return alert("Faltan datos del gasto");
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ accion: "nuevoGasto", concepto: c, monto: m })});
            totalGas += m; alert("Gasto Guardado"); document.getElementById('g-mon').value=''; document.getElementById('g-con').value=''; showTab('ventas');
        }

        function sendReport() {
            const total = totalEfe - totalGas;
            const msg = `🧾%20*CIERRE%20KUKURUZ*%0A💰%20Efe:%20$${totalEfe.toLocaleString()}%0A📱%20Neq:%20$${totalNeq.toLocaleString()}%0A💸%20Gas:%20$${totalGas.toLocaleString()}%0A---%0A🔥%20*CAJA:*%20$${total.toLocaleString()}`;
            window.open(`https://api.whatsapp.com/send?phone=573193490940&text=${msg}`);
        }

        function showTab(t) {
            ['ventas','admin','gastos','dash'].forEach(id => {
                const tab = document.getElementById('tab-'+id);
                if(tab) tab.classList.add('hidden');
                const btn = document.getElementById('btn-'+id);
                if(btn) btn.classList.remove('active-tab');
            });
            document.getElementById('tab-'+t).classList.remove('hidden');
            document.getElementById('btn-'+t).classList.add('active-tab');
            if(t === 'dash') {
                document.getElementById('res-ef').innerText = '$' + totalEfe.toLocaleString();
                document.getElementById('res-ne').innerText = '$' + totalNeq.toLocaleString();
                document.getElementById('res-gas').innerText = '$' + totalGas.toLocaleString();
                document.getElementById('res-total').innerText = '$' + (totalEfe - totalGas).toLocaleString();
            }
        }
        loadData();
    </script>
</body>
</html>
